defaults:
  environment: development

frontend:
  shared:
    api_prefix: /api/v1
  development:
    api_url: http://localhost:8005
  production:
    api_url: https://api.example.com

backend:
  shared:
    app_name: Bio Pipeline Manager
    log_level: INFO
    cors_origins:
      - http://localhost:3005
      - http://127.0.0.1:3005
      - http://localhost:3005
      - http://127.0.0.1:3005
    pipeline_home: .bio_pipeline
    worker_enabled: true
    worker_interval: 2.0
    worker_parallel: 1
    api_prefix: /api/v1
    docs_url: /api/docs
    redoc_url: /api/redoc
    auth_session_cookie_name: bio_pipeline_session
    auth_session_ttl_hours: 24
    auth_secure_cookies: false
    ai:
      default_provider: claude
      # Bounds provider calls per chat turn (caps latency and token usage).
      max_tool_iterations: 6
      # API keys come from the environment / .env (see .env.example).
      # ${VAR} placeholders are expanded server-side; a blank key also falls
      # back to a conventional per-provider env var (e.g. ANTHROPIC_API_KEY).
      providers:
        claude:
          enabled: true
          api_key: "${ANTHROPIC_API_KEY}"
          model: "claude-sonnet-4-6"
          base_url: https://api.anthropic.com
        openai:
          enabled: false
          api_key: "${OPENAI_API_KEY}"
          model: ""
          base_url: https://api.openai.com/v1
        gemini:
          enabled: false
          api_key: "${GEMINI_API_KEY}"
          model: ""
          base_url: https://generativelanguage.googleapis.com
        openai_compatible:
          enabled: false
          api_key: "${OPENAI_COMPATIBLE_API_KEY}"
          model: ""
          base_url: "${OPENAI_COMPATIBLE_BASE_URL}"
  development:
    app_env: development
  production:
    app_env: production
    docs_url: null
    redoc_url: null
    auth_secure_cookies: true
