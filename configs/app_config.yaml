defaults:
  environment: development

frontend:
  shared:
    api_prefix: /api/v1
  development:
    api_url: http://localhost:8006
  production:
    api_url: https://api.example.com

backend:
  shared:
    app_name: Bio Pipeline Manager
    log_level: DEBUG # INFO
    cors_origins:
      - http://localhost:3005
      - http://127.0.0.1:3005
      - http://localhost:3005
      - http://127.0.0.1:3005
      - http://0.0.0.0:3005
    pipeline_home: .bio_pipeline
    worker_enabled: true
    worker_interval: 2.0
    worker_parallel: 1
    api_prefix: /api/v1
    docs_url: /api/docs
    redoc_url: /api/redoc
    auth_session_cookie_name: bio_pipeline_session
    auth_session_ttl_hours: 168 # 7 days
    auth_secure_cookies: false
    # Allowlisted shared-storage roots a researcher may browse for published-job
    # inputs (instead of uploading). Each root is a server-mounted path; only
    # these directories are ever exposed, and every browsed sub-path is
    # containment-checked. Reference a root's `id` in a published field's
    # `shared_roots`. Empty by default.
    shared_roots: []
    #   - id: robot_scientist_ecoli
    #     label: "E. coli growth data"
    #     path: "H:/ROBOT_SCIENTIST/E_coli"
    ai:
      default_provider: claude
      # Bounds provider calls per chat turn (caps latency and token usage).
      max_tool_iterations: 6
      # Overall wall-clock budget (seconds) for one chat turn's tool loop. The
      # request is aborted with a 504 if it runs longer, so a stalled provider
      # cannot block a request for minutes. 0 disables the deadline.
      max_request_seconds: 120
      # API keys come from the environment / .env (see .env.example).
      # ${VAR} placeholders are expanded server-side; a blank key also falls
      # back to a conventional per-provider env var (e.g. ANTHROPIC_API_KEY).
      providers:
        claude:
          enabled: true
          api_key: "${ANTHROPIC_API_KEY}"
          model: "claude-sonnet-4-6"
          base_url: https://api.anthropic.com
        openai:
          enabled: false
          api_key: "${OPENAI_API_KEY}"
          model: ""
          base_url: https://api.openai.com/v1
        gemini:
          enabled: false
          api_key: "${GEMINI_API_KEY}"
          model: ""
          base_url: https://generativelanguage.googleapis.com
        openai_compatible:
          enabled: false
          api_key: "${OPENAI_COMPATIBLE_API_KEY}"
          model: ""
          base_url: "${OPENAI_COMPATIBLE_BASE_URL}"
  development:
    app_env: development
  production:
    app_env: production
    docs_url: null
    redoc_url: null
    auth_secure_cookies: true
