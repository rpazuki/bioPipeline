defaults:
  environment: development

frontend:
  shared:
    api_prefix: /api/v1
  development:
    api_url: http://localhost:8005
  production:
    api_url: https://api.example.com

backend:
  shared:
    app_name: Bio Pipeline Manager
    log_level: INFO
    cors_origins:
      - http://localhost:3005
      - http://127.0.0.1:3005
      - http://localhost:3005
      - http://127.0.0.1:3005
    pipeline_home: .bio_pipeline
    worker_enabled: true
    worker_interval: 2.0
    worker_parallel: 1
    api_prefix: /api/v1
    docs_url: /api/docs
    redoc_url: /api/redoc
    # Bearer token required by the /packages (package management) endpoints.
    # Empty = feature disabled (endpoints return 503). Prefer setting the real
    # value via the PACKAGE_ADMIN_TOKEN environment variable, which overrides
    # this — do NOT commit a real token to this file.
    package_admin_token: "123456"
  development:
    app_env: development
  production:
    app_env: production
    docs_url: null
    redoc_url: null
