[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-pipeline-manager"
version = "0.1.0"
description = "Lightweight YAML authoring, queueing, scheduling, and execution manager for labUtils pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "addict>=2.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]
labutils = [
    "labUtils @ git+https://github.com/rpazuki/lab_utils.git#subdirectory=src",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
bio-pipeline = "bio_pipeline_manager.cli:main"

# Explicit src-layout discovery so every install (editable, strict-editable,
# wheel, or sdist) bundles BOTH top-level packages under src/:
#   - bio_pipeline_manager (the manager/API)
#   - pipeline (the YAML/process engine that bio_pipeline_manager imports at
#     runtime in run_task.py and job_definition.py)
# Without this, setuptools falls back to automatic discovery, which can silently
# drop `pipeline` for non-editable installs and leave the app unimportable.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "backend"]

[tool.ruff]
line-length = 100
